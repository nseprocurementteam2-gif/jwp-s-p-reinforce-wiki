<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chart-gradient {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.05), transparent);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm sticky top-0 z-50 flex justify-between items-center px-gutter py-xs w-full">
<div class="flex items-center gap-sm">
<button class="active:scale-95 transition-transform duration-150">

</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">시장 분석</h1>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">notifications</span>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden border border-outline-variant">

</div>
</div>
</header>
<main class="px-margin-mobile py-lg flex flex-col gap-lg">
<!-- Commodity Header -->
<div class="flex justify-between items-end">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-base">원자재 상세</p>
<h2 class="font-display-kpi text-display-kpi text-primary">구리</h2>
<div class="flex items-center gap-xs mt-base">
<span class="font-data-tabular text-data-tabular text-on-tertiary-container bg-tertiary-fixed px-2 py-0.5 rounded-full">+2.4%</span>
<span class="font-body-md text-body-md text-on-surface-variant">전월 대비</span>
</div>
</div>
<button class="bg-primary text-on-primary px-lg py-sm rounded-lg font-label-caps text-label-caps active:scale-95 transition-transform duration-150 flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">download</span> 보고서 내보내기</button>
</div>
<!-- Chart Section -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-sm">
<div class="flex justify-between items-center mb-lg">
<div class="flex bg-surface-container-high rounded-lg p-1">
<button class="px-md py-1 rounded font-label-caps text-label-caps text-on-surface-variant">1M</button>
<button class="px-md py-1 rounded font-label-caps text-label-caps bg-surface-container-lowest shadow-sm text-primary">3M</button>
<button class="px-md py-1 rounded font-label-caps text-label-caps text-on-surface-variant">6M</button>
</div>
<span class="material-symbols-outlined text-outline">info</span>
</div>
<div class="h-48 w-full relative mb-md">
<!-- Mock Time Series Chart -->
<div class="absolute inset-0 flex items-end justify-between px-xs">
<div class="w-[8%] bg-secondary-container rounded-t-sm h-[40%]"></div>
<div class="w-[8%] bg-secondary-container rounded-t-sm h-[55%]"></div>
<div class="w-[8%] bg-secondary-container rounded-t-sm h-[45%]"></div>
<div class="w-[8%] bg-secondary-container rounded-t-sm h-[70%]"></div>

<div class="w-[8%] bg-secondary-container rounded-t-sm h-[90%]"></div>
<div class="w-[8%] bg-secondary-container rounded-t-sm h-[65%]"></div>
<div class="w-[8%] bg-secondary-container rounded-t-sm h-[80%]"></div>
</div>
<div class="absolute bottom-0 w-full border-b border-outline-variant"></div>
</div>

<div class="grid grid-cols-2 gap-md border-t border-outline-variant pt-md">
<div class="flex flex-col">
<p class="font-label-caps text-label-caps text-on-surface-variant">최저가</p>
<p class="font-headline-sm text-headline-sm text-primary">$8,420 <span class="text-xs text-on-surface-variant font-normal">/ MT</span></p>
</div>
<div class="flex flex-col">
<p class="font-label-caps text-label-caps text-on-surface-variant">최고가</p>
<p class="font-headline-sm text-headline-sm text-primary">$9,150 <span class="text-xs text-on-surface-variant font-normal">/ MT</span></p>
</div>
<div class="flex flex-col">
<p class="font-label-caps text-label-caps text-on-surface-variant">평균가</p>
<p class="font-headline-sm text-headline-sm text-primary">$8,785 <span class="text-xs text-on-surface-variant font-normal">/ MT</span></p>
</div>
<div class="flex flex-col">
<p class="font-label-caps text-label-caps text-on-surface-variant">변동성</p>
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-error"></span>
<p class="font-headline-sm text-headline-sm text-primary">높음</p>
</div>
</div>
</div>
</section>
<!-- News Feed -->

</div>
<div class="flex flex-col gap-md">
<!-- News Item 1 -->

<div class="w-24 h-24 flex-shrink-0">

</div>
</div>
<!-- News Item 2 -->

</div>
<div class="p-md flex flex-col justify-center">

<h4 class="font-body-md text-body-md font-semibold text-primary line-clamp-2">전기차 제조 급증으로 인한 구리 재고 부족 현상</h4>
<p class="text-[11px] text-on-surface-variant mt-1">5시간 전 • Bloomberg</p>
</div>
</div>
</div>
</section>
</main>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface shadow-lg">
