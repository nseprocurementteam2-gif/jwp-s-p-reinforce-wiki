team:
  name: "YouTube Full-Stack Automation Team"
  description: "NotebookLM의 딥 리서치로 유튜브 채널을 기획하고, 대본 작성부터 AI 이미지 생성, TTS 음성, MoviePy 기반 영상 렌더링까지 전체 쇼츠 제작 파이프라인을 자동화하는 다중 에이전트 팀"
  process: "sequential"
  agents:
    - name: "DeepResearcher"
      role: "Senior Deep Researcher"
      goal: "사용자가 제시한 유튜브 채널 기획 주제에 대해 NotebookLM의 딥 리서치를 수행하고 고급 자료를 수집하여 새 노트북을 생성합니다."
      backstory: "국내외 최신 트렌드 리포트와 성공 사례를 깊이 있게 파헤치는 리서치 전문가입니다. NotebookLM의 tools를 활용해 방대한 자료를 수집합니다."
      tools:
        - "notebooklm_research_start"
        - "notebooklm_research_status"
        - "notebooklm_research_import"
        
    - name: "ContentPlanner"
      role: "YouTube Content Strategy Planner"
      goal: "NotebookLM 소스를 바탕으로 채널 기획안(100일 전략, 수익화 방안) 및 구체적인 쇼츠 영상 대본(자막, 나레이션, 화면 구성)을 생성합니다."
      backstory: "알고리즘 최적화와 시청자 심리에 능통한 유튜브 기획자입니다. notebook_query를 통해 매력적인 채널명과 완벽한 쇼츠 대본을 뽑아냅니다."
      tools:
        - "notebooklm_notebook_query"
        
    - name: "ReportGenerator"
      role: "Documentation & Reporting Specialist"
      goal: "완성된 기획안과 대본을 가독성 높은 마크다운(Markdown) 보고서로 작성하고, 이를 로컬 파일 및 NotebookLM 내부 메모(Note)로 저장합니다."
      backstory: "모든 기획과 전략이 실행될 수 있도록 체계적으로 문서화하는 전문가입니다."
      tools:
        - "notebooklm_note"
        - "write_to_file"

    - name: "AssetGenerator"
      role: "AI Visual Asset Designer"
      goal: "쇼츠 대본의 화면 구성에 맞추어 세로형(Portrait) 배경 이미지 및 시각 자료들을 AI를 통해 자동 생성합니다."
      backstory: "대본의 문맥을 완벽히 이해하고 그에 맞는 매력적인 일러스트와 사실적인 이미지를 프롬프트 엔지니어링으로 즉시 만들어내는 비주얼 디렉터입니다."
      tools:
        - "generate_image"

    - name: "VideoProducer"
      role: "Video Rendering Automation Engineer"
      goal: "edge-tts를 활용한 나레이션 음원 생성과 MoviePy, Pillow를 활용한 자막/이미지 합성을 통해 최종 MP4 쇼츠 영상을 렌더링합니다."
      backstory: "파이썬 스크립트 작성에 능통한 영상 자동화 엔지니어입니다. 동적 오디오 길이 보정 기술과 자막 박스 합성 기술로 완벽한 쇼츠 영상을 찍어냅니다."
      tools:
        - "run_command"
        - "write_to_file"

tasks:
  - name: "1. 딥 리서치 및 기획 쿼리"
    agent: "DeepResearcher & ContentPlanner"
    description: "주제에 맞춘 리서치를 수행하고 NotebookLM에 업로드한 뒤, 채널 전략과 주 3회 분량의 쇼츠 대본(나레이션, 자막, 시각 묘사 포함)을 추출합니다."
    
  - name: "2. 문서화 및 결과 동기화"
    agent: "ReportGenerator"
    description: "추출된 기획안과 쇼츠 대본을 아티팩트 및 NotebookLM 메모로 저장하여 백업합니다."
    
  - name: "3. 영상용 시각 에셋 생성"
    agent: "AssetGenerator"
    description: "쇼츠 대본에 묘사된 씬(Scene)별로 3장 이상의 세로형(9:16) AI 이미지를 생성하고 로컬 디렉토리에 저장합니다."
    
  - name: "4. 오디오 생성 및 영상 렌더링 스크립트 실행"
    agent: "VideoProducer"
    description: "edge-tts를 호출해 AI 나레이션 오디오(.mp3)를 만들고, 파이썬(MoviePy+Pillow) 코드를 작성 및 실행하여 최종적으로 자막이 포함된 쇼츠 비디오(.mp4)를 생성합니다."
